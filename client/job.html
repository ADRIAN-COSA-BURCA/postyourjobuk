<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Opportunity — PostYourJobUK</title>
    <link rel="stylesheet" href="/assets/css/styles.css?v=9">
</head>
<body>
    <div id="app-header"></div>

    <main id="main-content" class="container section" tabindex="-1">
        <div id="job-detail-host">
            <p class="text-muted">Loading job specification…</p>
        </div>
    </main>

    <!-- WCAG 2.1 AA Duplicate Application Modal -->
    <div id="duplicate-app-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="duplicate-modal-title" aria-hidden="true">
        <div class="modal-dialog">
            <h2 id="duplicate-modal-title" style="color: #fbbf24; font-size: 1.3rem; margin-bottom: 0.75rem;">⚠️ Application Already On File</h2>
            <p id="duplicate-modal-body" class="text-muted" style="margin-bottom: 1.5rem;"></p>
            <div style="display: flex; justify-content: flex-end; gap: 0.75rem;">
                <a href="/" class="btn btn-ghost">Browse Other Jobs</a>
                <button type="button" class="btn btn-primary" onclick="window.AppA11y.closeModal('duplicate-app-modal')">Understood</button>
            </div>
        </div>
    </div>

    <div id="app-footer"></div>

    <script src="/assets/js/api.js?v=9"></script>
    <script src="/assets/js/a11y.js?v=9"></script>
    <script src="/assets/js/public.js?v=9"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const session = await window.AppApi.initSession();
            window.AppA11y.renderSharedShell(session);
            window.AppPublic.initJobDetailView();
        });
    </script>
</body>
</html>
