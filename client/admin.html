<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super-Admin Governance Console — PostYourJobUK</title>
    <link rel="stylesheet" href="/assets/css/styles.css?v=5">
</head>
<body>
    <div id="app-header"></div>

    <main id="main-content" class="container admin-wrapper-view" tabindex="-1">
        <div id="admin-view-host">
            <p class="text-muted">Loading Super-Admin Console…</p>
        </div>
    </main>

    <!-- WCAG 2.1 AA Create New Recruiter Modal -->
    <div id="create-tenant-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="create-tenant-title" aria-hidden="true">
        <div class="modal-dialog">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2 id="create-tenant-title" style="font-size: 1.25rem; margin: 0;">+ Create New Recruiter Tenant</h2>
                <button type="button" class="btn btn-ghost btn-sm" onclick="window.AppA11y.closeModal('create-tenant-modal')" aria-label="Close modal">✕</button>
            </div>
            <form id="create-tenant-form">
                <div class="grid-2" style="gap: 0.75rem; margin-bottom: 0;">
                    <div class="form-group"><label for="ct-comp">Company Name *</label><input type="text" id="ct-comp" name="company_name" required></div>
                    <div class="form-group"><label for="ct-contact">Contact Person</label><input type="text" id="ct-contact" name="contact_person"></div>
                </div>
                <div class="grid-2" style="gap: 0.75rem; margin-bottom: 0;">
                    <div class="form-group"><label for="ct-email">Corporate Email *</label><input type="email" id="ct-email" name="email" required></div>
                    <div class="form-group"><label for="ct-phone">Phone Number</label><input type="text" id="ct-phone" name="phone_number"></div>
                </div>
                <div class="grid-2" style="gap: 0.75rem; margin-bottom: 0;">
                    <div class="form-group"><label for="ct-ind">Industry</label><input type="text" id="ct-ind" name="industry" placeholder="Technology / Finance"></div>
                    <div class="form-group"><label for="ct-web">Website URL</label><input type="url" id="ct-web" name="website_url"></div>
                </div>
                <div class="form-group"><label for="ct-addr">Company Address</label><input type="text" id="ct-addr" name="company_address"></div>
                <div class="grid-2" style="gap: 0.75rem; margin-bottom: 0;">
                    <div class="form-group"><label for="ct-pass">Initial Password *</label><input type="password" id="ct-pass" name="password" required minlength="8"></div>
                    <div class="form-group"><label for="ct-rec">Recovery Code *</label><input type="text" id="ct-rec" name="recovery_code" required placeholder="RECOV-2026"></div>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 0.75rem;">
                    <button type="button" class="btn btn-ghost" onclick="window.AppA11y.closeModal('create-tenant-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Provision Workspace</button>
                </div>
            </form>
        </div>
    </div>

    <!-- WCAG 2.1 AA Counterfactual Evidence Inspector Modal -->
    <div id="fairness-evidence-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="fairness-modal-title" aria-hidden="true">
        <div class="modal-dialog modal-dialog-xl">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <h2 id="fairness-modal-title" style="font-size: 1.25rem; margin: 0;">Forensic Evidence Inspector</h2>
                <button type="button" class="btn btn-ghost btn-sm" onclick="window.AppA11y.closeModal('fairness-evidence-modal')" aria-label="Close modal">✕</button>
            </div>
            <div id="fairness-modal-body"></div>
        </div>
    </div>

    <div id="app-footer"></div>

    <script src="/assets/js/api.js?v=5"></script>
    <script src="/assets/js/a11y.js?v=5"></script>
    <script src="/assets/js/charts.js?v=5"></script>
    <script src="/assets/js/admin.js?v=5"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const session = await window.AppApi.initSession();
            window.AppA11y.renderSharedShell(session);
            window.AppAdmin.initAdminPortal();
        });
    </script>
</body>
</html>
