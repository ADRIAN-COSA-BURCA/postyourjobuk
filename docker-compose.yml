services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    # Add this line to override the default Apache DocumentRoot
    command: /bin/sh -c "sed -i 's|/var/www/html|/var/www/html/public|g' /etc/apache2/sites-available/000-default.conf && apache2-foreground"
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: postyourjobhere
      MYSQL_ROOT_PASSWORD: Gelutu@010380
    ports:
      - "3306:3306"