services:
  web:
    build: .
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    env_file:
      - .env  # <--- THIS PASSES YOUR BASE_URL AND DB KEYS INTO LINUX
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: postyourjobhere
      MYSQL_ROOT_PASSWORD: Gelutu@010380
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./azure_database.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data: